<title>CrediMach - Préstamos PRO</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,Arial}
body{background:#050507;color:#fff;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:#050507}
.bg::before{content:'';position:absolute;width:130%;height:130%;top:-15%;left:-15%;background:radial-gradient(600px at 20% 20%, rgba(255,10,42,.18), transparent 60%), radial-gradient(700px at 80% 30%, rgba(255,10,42,.10), transparent 60%);animation:mov 28s infinite alternate}
@keyframes mov{0%{transform:translate(-2%,-1%)}100%{transform:translate(2%,1%)}}
.card{border-radius:20px;background:rgba(17,17,17,.9);border:1px solid rgba(255,255,255,.07);padding:16px;transition:.2s}
.card:hover{border-color:rgba(255,10,42,.2)}
.btn-red{background:linear-gradient(180deg,#FF1A2F,#E00A22);color:#fff;border:none;border-radius:12px;font-weight:900;cursor:pointer;height:46px;padding:0 18px}
.btn-green{background:linear-gradient(180deg,#10B981,#059669);color:#fff;border:none;border-radius:12px;font-weight:900;cursor:pointer;height:46px;padding:0 18px}
.input,select{width:100%;height:46px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:0 14px;color:#fff;outline:none}
.badge{padding:3px 9px;border-radius:99px;font-size:9px;font-weight:900;line-height:1;display:inline-flex;align-items:center;justify-content:center;height:20px;letter-spacing:.04em;white-space:nowrap;min-width:52px}
.glass{background:rgba(17,17,17,.96);border:1px solid rgba(255,255,255,.1);border-radius:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;gap:10px;margin-top:14px}
@media(max-width:768px){.grid4{grid-template-columns:1fr 1fr}}
@media(min-width:769px){.grid4{grid-template-columns:repeat(4,1fr)}}
.clients{display:grid;gap:12px;margin-top:16px}
@media(min-width:769px){.clients{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}}
.progress{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:10px}
.progress>div{height:100%;background:linear-gradient(90deg,#FF0A2A,#FF6B6B);border-radius:99px}
</style>
</head>

const STORAGE='prestamos_v5';
const AUTH='prestamos_auth_v2';
const SALT='prestamo_2026_SALT';
const DEF_USER='admin';
const DEF_PASS='admin2026';
function sha256(s){return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''))}
async function hashPass(p){return await sha256(SALT+'|'+p)}
const today=()=>new Date().toISOString().split('T')[0];
const add=(d,n,t)=>{let x=new Date(d+'T12:00:00'); if(t==='DIARIA') x.setDate(x.getDate()+n); else if(t==='SEMANAL') x.setDate(x.getDate()+n*7); else x.setMonth(x.getMonth()+n); return x.toISOString().split('T')[0]};
const fmt=s=>{let [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const diff=s=>{let a=new Date();a.setHours(0,0,0,0);let b=new Date(s+'T12:00:00');b.setHours(0,0,0,0);return Math.ceil((b-a)/86400000)};

{id:'1',nombre:'JULIAN FERREYRA',whatsapp:'5493734525075',direccion:'Av. Belgrano 245',descripcion:'Cliente puntual, vive cerca del gym',monto:50000,interes:30,mora:10,tipo:'MENSUAL',cuotas:4,fecha:today(),pagos:[{fecha:today(),monto:16250,metodo:'EFECTIVO'}]},
{id:'2',nombre:'Maxi Sanchez',whatsapp:'5493734123456',direccion:'Barrio Centro - Calle 12',descripcion:'Trabaja en construcción',monto:100000,interes:40,mora:5,tipo:'SEMANAL',cuotas:8,fecha:today(),pagos:[]},
];

function calc(p){
  let moraPct = p.mora!=null ? p.mora : (p.tipo==='DIARIA'?2 : p.tipo==='SEMANAL'?5 : 10);
  let totalBase = p.monto*(1+p.interes/100);
  let valorBase = totalBase/p.cuotas;
  let pagado = p.pagos.reduce((a,b)=>a+b.monto,0);
  let cuotasPagadas = Math.floor(pagado/valorBase+0.0001);
  let prox = add(p.fecha, cuotasPagadas+1, p.tipo);
  let atraso=false, dias=0, mora=0;
  let d = diff(prox);
  if(d<0 && (totalBase-pagado)>10){ atraso=true; dias=Math.abs(d); if(p.tipo==='DIARIA') mora=valorBase*(moraPct/100)*dias; else if(p.tipo==='SEMANAL') mora=valorBase*(moraPct/100)*Math.ceil(dias/7); else mora=valorBase*(moraPct/100)*Math.ceil(dias/30); }
  let total = totalBase+mora;
  let falta = Math.max(0,total-pagado);
  let pct = total>0 ? Math.min(100,Math.round(pagado/total*100)) : 0;
  return {total,totalBase,valorBase,valorCuota:total/p.cuotas,pagado,falta,mora,moraPct,cuotasPagadas,prox,atraso,dias,pct};
}

let isAuth=false, q='', fil='TODOS', repTab='HOY', editing=null, showForm=false, showPago=null, showTicket=null, showSettings=false, showReportes=false, loginErr='';

async function init(){
 if(!authData){let h=await hashPass(DEF_PASS);authData={user:DEF_USER,hash:h};localStorage.setItem(AUTH,JSON.stringify(authData))}
 if(sessionStorage.getItem('prest_session')==='ok') isAuth=true;
 render();
}
function save(){localStorage.setItem(STORAGE,JSON.stringify(prestamos));render()}
async function tryLogin(){
 let u=document.getElementById('lu').value.trim().toLowerCase();
 let p=document.getElementById('lp').value;
 if(!u||!p){loginErr='Faltan datos';render();return}
 let hp=await hashPass(p);
 if(u!==authData.user.toLowerCase()||hp!==authData.hash){loginErr='Usuario o clave incorrectos';render();return}
 isAuth=true;sessionStorage.setItem('prest_session','ok');render();
}

function exportExcel(tipo){
  let getWeekStart=()=>{let d=new Date();d.setDate(d.getDate()-d.getDay());return d.toISOString().split('T')[0]};
  let getMonthStart=()=>{let d=new Date();d.setDate(1);return d.toISOString().split('T')[0]};
  let hoy=today();
  let all=[];
  prestamos.forEach(p=>{
    p.pagos.forEach(pg=>{
      all.push({fecha:pg.fecha,cliente:p.nombre,telefono:p.whatsapp,direccion:p.direccion||'',monto:pg.monto,metodo:pg.metodo||'EFECTIVO',prestamo:p.monto,interes:p.interes,tipo:p.tipo,cuotas:p.cuotas});
    });
  });
  let filtered = tipo==='HOY'?all.filter(x=>x.fecha===hoy) : tipo==='SEMANA'?all.filter(x=>x.fecha>=getWeekStart()) : tipo==='MES'?all.filter(x=>x.fecha>=getMonthStart()) : all;
  if(filtered.length===0){alert('No hay datos para '+tipo);return}
  let csv='Fecha,Cliente,Telefono,Direccion,Monto,Metodo,Prestamo Base,Interes,Tipo,Cuotas\n';
  filtered.forEach(r=>{csv+=`${r.fecha},"${r.cliente}",${r.telefono},"${r.direccion}",${r.monto},${r.metodo},${r.prestamo},${r.interes},${r.tipo},${r.cuotas}\n`});
  let efectivo=filtered.filter(x=>x.metodo==='EFECTIVO').reduce((a,b)=>a+b.monto,0);
  let transfer=filtered.filter(x=>x.metodo==='TRANSFERENCIA').reduce((a,b)=>a+b.monto,0);
  let total=efectivo+transfer;
  csv+=`\nRESUMEN ${tipo},,,,\n`;
  csv+=`Efectivo,${efectivo}\n`;
  csv+=`Transferencia,${transfer}\n`;
  csv+=`TOTAL,${total}\n`;
  csv+=`Cantidad pagos,${filtered.length}\n`;
  let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`CrediMach_${tipo}_${hoy}.csv`;a.click();
}
function backupJSON(){
  let data=JSON.stringify(prestamos,null,2);
  let blob=new Blob([data],{type:'application/json'});
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`CrediMach_BACKUP_${today()}.json`;a.click();
}
function shareDailyReport(){
  let hoy=today();
  let all=[];
  prestamos.forEach(p=>{p.pagos.forEach(pg=>{if(pg.fecha===hoy) all.push({...pg,cliente:p.nombre})})});
  let ef=all.filter(x=>x.metodo==='EFECTIVO').reduce((a,b)=>a+b.monto,0);
  let tr=all.filter(x=>x.metodo==='TRANSFERENCIA').reduce((a,b)=>a+b.monto,0);
  let tot=ef+tr;
  let msg=`*CREDIMACH - REPORTE DIARIO ${fmt(hoy)}*%0A%0A💵 EFECTIVO: $${ef.toLocaleString('es-AR')}%0A🏦 TRANSFERENCIA: $${tr.toLocaleString('es-AR')}%0A💰 TOTAL HOY: $${tot.toLocaleString('es-AR')}%0A📋 Pagos: ${all.length}%0A%0A${all.map(x=>`• ${x.cliente} $${x.monto.toLocaleString('es-AR')} ${x.metodo}`).join('%0A')}`;
  window.open(`https://wa.me/?text=${msg}`,'_blank');
}
async function changePassword(){
  let oldP=document.getElementById('oldPass').value;
  let newU=document.getElementById('newUser').value.trim();
  let newP=document.getElementById('newPass').value;
  let newP2=document.getElementById('newPass2').value;
  let msgEl=document.getElementById('passMsg');
  if(!oldP||!newP){msgEl.innerHTML='<span style="color:#FF6B6B">Completá actual y nueva</span>';return}
  if(newP!==newP2){msgEl.innerHTML='<span style="color:#FF6B6B">Las nuevas no coinciden</span>';return}
  if(newP.length<4){msgEl.innerHTML='<span style="color:#FF6B6B">Mínimo 4 caracteres</span>';return}
  let hOld=await hashPass(oldP);
  if(hOld!==authData.hash){msgEl.innerHTML='<span style="color:#FF6B6B">Contraseña actual incorrecta</span>';return}
  let hNew=await hashPass(newP);
  authData.user = newU || authData.user;
  authData.hash = hNew;
  localStorage.setItem(AUTH, JSON.stringify(authData));
  msgEl.innerHTML='<span style="color:#10B981">✅ Contraseña cambiada!</span>';
  setTimeout(()=>{showSettings=false;render()},1200);
}

function installApp(){
 if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{deferredPrompt=null;});}
 else{alert('Para instalar sin internet:\n\nEn Chrome: Menú ⋮ > Instalar app / Agregar a pantalla principal\nEn iPhone: Compartir > Agregar a inicio\n\nUna vez instalada funciona 100% offline');}
}

}
